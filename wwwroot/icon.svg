<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e20" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd7f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#4cd7f6" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Neural Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-dasharray="24 16" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#4cd7f6" stroke-width="4" stroke-dasharray="8 20" stroke-opacity="0.3" />

  <!-- Brain / Microchip Circuit Nodes -->
  <g filter="url(#glow)">
    <!-- Central Lightning / Neural Core -->
    <path d="M256 96 L296 224 L360 224 L224 416 L248 272 L184 272 Z" fill="url(#cyanViolet)" />
  </g>

  <!-- High-tech Node Dots -->
  <circle cx="160" cy="180" r="10" fill="#4cd7f6" />
  <circle cx="352" cy="180" r="10" fill="#8b5cf6" />
  <circle cx="140" cy="320" r="8" fill="#8b5cf6" />
  <circle cx="372" cy="320" r="8" fill="#4cd7f6" />
  <circle cx="256" cy="440" r="10" fill="#4cd7f6" />

  <!-- Circuit Trace Lines -->
  <path d="M160 180 L220 220 M352 180 L290 220 M140 320 L210 320 M372 320 L300 320" stroke="#4cd7f6" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />
</svg>
