<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#07111f" />
  <title>Administrator Sign In | TechPulse AI</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #07111f; color: #e8f1fa; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #15324a 0, #07111f 60%); }
    main { width: min(100%, 420px); padding: 36px; border: 1px solid #294055; border-radius: 22px; background: #101e2c; box-shadow: 0 24px 80px #0008; }
    .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 28px; }
    .brand img { width: 48px; height: 48px; }
    .brand strong { display: block; font-size: 17px; }
    .brand span { display: block; margin-top: 3px; color: #92aabd; font-size: 12px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .hint { margin: 0 0 24px; color: #9bb0c1; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; color: #c7d5e1; font-size: 13px; font-weight: 600; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #344b60; border-radius: 10px; outline: none; background: #091521; color: #f4f8fc; font-size: 15px; }
    input:focus { border-color: #51c7e8; box-shadow: 0 0 0 3px #51c7e833; }
    button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 10px; background: linear-gradient(100deg, #39b8dc, #6787f5); color: #06111e; font-size: 15px; font-weight: 750; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 20px; margin: 15px 0 0; color: #ff9eaa; font-size: 13px; line-height: 1.45; }
    .back { display: block; margin-top: 18px; color: #90cde2; font-size: 13px; text-align: center; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    @media (max-width: 480px) { main { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/icon.svg" alt="" />
      <div><strong>TechPulse AI</strong><span>Administrator access</span></div>
    </div>
    <h1>Admin sign in</h1>
    <p class="hint">Use the separate administrator credentials to continue.</p>
    <form id="admin-login-form">
      <label for="username">Admin username</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="submit" type="submit">Sign in</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>
    <a class="back" href="/">Return to the news feed</a>
  </main>
  <script>
    const form = document.getElementById('admin-login-form');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await response.json();
        if (!response.ok) {
          message.textContent = data.message || 'Administrator sign-in failed.';
          return;
        }
        window.location.replace('/');
      } catch {
        message.textContent = 'Could not connect. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
