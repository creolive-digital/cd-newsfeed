<script>
  // Password Strength Interactive Logic
  const passwordInput = document.getElementById('password-input');
  const bar1 = document.getElementById('bar-1');
  const bar2 = document.getElementById('bar-2');
  const bar3 = document.getElementById('bar-3');
  const strengthLabel = document.getElementById('strength-label');
  const togglePwBtn = document.getElementById('toggle-pw-btn');
  const eyeIcon = document.getElementById('eye-icon');

  if (passwordInput) {
    passwordInput.addEventListener('input', (e) => {
      const val = e.target.value;
      const len = val.length;
      const hasNumberOrSymbol = /[\d!@#$%^&*(),.?":{}|<>]/.test(val);

      if (len === 0) {
        bar1.className = 'h-1.5 rounded-full bg-surface-container-highest transition-colors duration-300';
        bar2.className = 'h-1.5 rounded-full bg-surface-container-highest transition-colors duration-300';
        bar3.className = 'h-1.5 rounded-full bg-surface-container-highest transition-colors duration-300';
        strengthLabel.textContent = 'දුර්වල (Weak)';
        strengthLabel.className = 'font-label-sm text-label-sm text-outline';
      } else if (len < 6) {
        // Weak
        bar1.className = 'h-1.5 rounded-full bg-error transition-colors duration-300';
        bar2.className = 'h-1.5 rounded-full bg-surface-container-highest transition-colors duration-300';
        bar3.className = 'h-1.5 rounded-full bg-surface-container-highest transition-colors duration-300';
        strengthLabel.textContent = 'දුර්වල (Weak)';
        strengthLabel.className = 'font-label-sm text-label-sm text-error';
      } else if (len >= 6 && (!hasNumberOrSymbol || len < 9)) {
        // Medium
        bar1.className = 'h-1.5 rounded-full bg-secondary transition-colors duration-300';
        bar2.className = 'h-1.5 rounded-full bg-secondary transition-colors duration-300';
        bar3.className = 'h-1.5 rounded-full bg-surface-container-highest transition-colors duration-300';
        strengthLabel.textContent = 'මධ්‍යස්ථ (Medium)';
        strengthLabel.className = 'font-label-sm text-label-sm text-secondary';
      } else {
        // Strong
        bar1.className = 'h-1.5 rounded-full bg-primary transition-colors duration-300';
        bar2.className = 'h-1.5 rounded-full bg-primary transition-colors duration-300';
        bar3.className = 'h-1.5 rounded-full bg-primary transition-colors duration-300';
        strengthLabel.textContent = 'ශක්තිමත් (Strong)';
        strengthLabel.className = 'font-label-sm text-label-sm text-primary';
      }
    });
  }

  // Toggle Password Visibility
  if (togglePwBtn && passwordInput) {
    togglePwBtn.addEventListener('click', () => {
      const isPass = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPass ? 'text' : 'password');
      eyeIcon.textContent = isPass ? 'visibility_off' : 'visibility';
    });
  }

  // Tech Interests Multi-Select Chips
  const chipContainer = document.getElementById('interests-container');
  if (chipContainer) {
    const chips = chipContainer.querySelectorAll('.interest-chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const isSelected = chip.classList.contains('active');
        if (isSelected) {
          chip.classList.remove('active', 'bg-primary/20', 'text-primary');
          chip.classList.add('bg-surface-container-high', 'text-on-surface');
        } else {
          chip.classList.add('active', 'bg-primary/20', 'text-primary');
          chip.classList.remove('bg-surface-container-high', 'text-on-surface');
        }
      });
    });
  }

  // Language switch feedback micro-interaction
  const langBtn = document.getElementById('lang-switch-btn');
  if (langBtn) {
    langBtn.addEventListener('click', () => {
      langBtn.classList.add('scale-95');
      setTimeout(() => langBtn.classList.remove('scale-95'), 150);
    });
  }
</script></main></body></html>
