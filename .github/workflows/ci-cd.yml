name: CI and VPS deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USE_INMEMORY_DB: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run integration tests
        run: dotnet test ./NewsFeed.Tests/NewsFeed.Tests.csproj --configuration Release

      - name: Publish application
        run: dotnet publish ./cd-newsfeed.csproj --configuration Release --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-news-publish
          path: ./publish
          if-no-files-found: error

  deploy-vps:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: sinhala-news-publish
          path: ./publish

      - name: Copy application to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./publish/*"
          target: /var/www/sinhala-news
          strip_components: 1

      - name: Restart application service
        uses: appleboy/ssh-action@v1.0.3
        env:
          ASPNETCORE_URLS: http://0.0.0.0:4050
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ASPNETCORE_URLS
          script: |
            sudo sed -i '/^ASPNETCORE_URLS=/d' /etc/sinhala-news/sinhala-news.env
            printf 'ASPNETCORE_URLS=%s\n' "$ASPNETCORE_URLS" | sudo tee -a /etc/sinhala-news/sinhala-news.env >/dev/null
            sudo chmod 600 /etc/sinhala-news/sinhala-news.env
            sudo install -d -o sinhala-news -g sinhala-news -m 750 /var/www/sinhala-news/wwwroot/uploads/profiles
            sudo install -d -o sinhala-news -g sinhala-news -m 750 /var/www/sinhala-news/wwwroot/uploads/posts
            sudo chown -R sinhala-news:sinhala-news /var/www/sinhala-news/wwwroot/uploads
            sudo systemctl restart sinhala-news.service
            sudo systemctl is-active --quiet sinhala-news.service
